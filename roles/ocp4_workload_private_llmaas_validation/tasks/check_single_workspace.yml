---
# Validate single user DevWorkspace

- name: Set workspace namespace
  ansible.builtin.set_fact:
    _workspace_namespace: "{{ ocp4_workload_private_llmaas_validation_workspace_namespace_prefix }}-{{ _user }}"

- name: Get all pods in workspace namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _workspace_namespace }}"
  register: _workspace_pods
  ignore_errors: true

- name: Count workspace pods by name pattern
  ansible.builtin.set_fact:
    _workspace_pods_running: >-
      {{
        _workspace_pods.resources | default([]) |
        selectattr('metadata.name', 'search', ocp4_workload_private_llmaas_validation_workspace_pod_pattern) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length | int
        if (_workspace_pods is defined and not _workspace_pods.failed | default(false))
        else 0
      }}

- name: Check workspace routes
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ _workspace_namespace }}"
  register: _workspace_routes
  ignore_errors: true

- name: Extract workspace route hostname
  ansible.builtin.set_fact:
    _workspace_route_host: >-
      {{
        (_workspace_routes.resources | default([]) | first).spec.host | default('')
        if (_workspace_routes.resources | default([]) | length > 0)
        else ''
      }}
    _workspace_route_exists: >-
      {{
        _workspace_routes is defined and
        not _workspace_routes.failed | default(false) and
        (_workspace_routes.resources | default([]) | length > 0)
      }}

- name: Check workspace HTTPS endpoint
  ansible.builtin.uri:
    url: "https://{{ _workspace_route_host }}"
    method: GET
    validate_certs: "{{ ocp4_workload_private_llmaas_validation_http_validate_certs }}"
    timeout: "{{ ocp4_workload_private_llmaas_validation_http_timeout }}"
    status_code: "{{ ocp4_workload_private_llmaas_validation_http_success_codes }}"
  register: _workspace_http_check
  ignore_errors: true
  when: _workspace_route_exists

- name: Determine workspace status for {{ _user }}
  ansible.builtin.set_fact:
    _workspace_status: >-
      {{
        'healthy' if _workspace_pods_running | int >= 1
        else 'failed'
      }}

- name: Add workspace validation result for {{ _user }}
  ansible.builtin.set_fact:
    _validation_results: >-
      {{
        _validation_results + [{
          'component': 'DevWorkspace (' ~ _user ~ ')',
          'namespace': _workspace_namespace,
          'status': _workspace_status,
          'details': {
            'pods': _workspace_pods_running ~ '/1',
            'route': _workspace_route_host if _workspace_route_exists else 'Not found',
            'http_accessible': 'Yes' if (_workspace_http_check is defined and _workspace_http_check is not failed) else 'No'
          }
        }]
      }}

- name: Add workspace issues to validation issues list
  ansible.builtin.set_fact:
    _validation_issues: >-
      {{
        _validation_issues + [
          _user ~ ' DevWorkspace: pods not running (workspace created on user login)'
        ]
      }}
  when: _workspace_status != 'healthy'
