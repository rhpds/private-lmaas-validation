---
# Validate OpenShift GitOps deployment

- name: Get all pods in openshift-gitops namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_workload_private_llmaas_validation_gitops_namespace }}"
  register: _gitops_pods
  ignore_errors: true

- name: Count GitOps Application Controller pods
  ansible.builtin.set_fact:
    _gitops_controller_pods_running: >-
      {{
        _gitops_pods.resources | default([]) |
        selectattr('metadata.name', 'search', ocp4_workload_private_llmaas_validation_gitops_controller_pattern) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length | int
      }}

- name: Count GitOps Server pods
  ansible.builtin.set_fact:
    _gitops_server_pods_running: >-
      {{
        _gitops_pods.resources | default([]) |
        selectattr('metadata.name', 'search', ocp4_workload_private_llmaas_validation_gitops_server_pattern) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length | int
      }}

- name: Count GitOps Repo Server pods
  ansible.builtin.set_fact:
    _gitops_repo_pods_running: >-
      {{
        _gitops_pods.resources | default([]) |
        selectattr('metadata.name', 'search', ocp4_workload_private_llmaas_validation_gitops_repo_pattern) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length | int
      }}

- name: Determine GitOps status
  ansible.builtin.set_fact:
    _gitops_status: >-
      {{
        'healthy' if (
          _gitops_controller_pods_running | int >= 1 and
          _gitops_server_pods_running | int >= 1 and
          _gitops_repo_pods_running | int >= 1
        )
        else 'degraded' if (
          _gitops_controller_pods_running | int >= 1 or
          _gitops_server_pods_running | int >= 1
        )
        else 'failed'
      }}

- name: Add GitOps validation result
  ansible.builtin.set_fact:
    _validation_results: >-
      {{
        _validation_results + [{
          'component': 'OpenShift GitOps',
          'namespace': ocp4_workload_private_llmaas_validation_gitops_namespace,
          'status': _gitops_status,
          'details': {
            'controller_pods': _gitops_controller_pods_running ~ '/1',
            'server_pods': _gitops_server_pods_running ~ '/1',
            'repo_server_pods': _gitops_repo_pods_running ~ '/1'
          }
        }]
      }}

- name: Add GitOps issues to validation issues list
  ansible.builtin.set_fact:
    _validation_issues: >-
      {{
        _validation_issues + [
          'OpenShift GitOps: ' ~
          ('Application Controller not running' if _gitops_controller_pods_running | int < 1 else '') ~
          (' | ' if (_gitops_controller_pods_running | int < 1 and _gitops_server_pods_running | int < 1) else '') ~
          ('Server not running' if _gitops_server_pods_running | int < 1 else '') ~
          (' | ' if (_gitops_server_pods_running | int < 1 and _gitops_repo_pods_running | int < 1) else '') ~
          ('Repo Server not running' if _gitops_repo_pods_running | int < 1 else '')
        ]
      }}
  when: _gitops_status != 'healthy'
